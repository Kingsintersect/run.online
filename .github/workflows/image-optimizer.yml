# qhub.portal.sandbox.qverselearning.org

name: Optimize Images

on:
  push:
    branches:
      - develop
      # - main

jobs:
  optimize:
    runs-on: ubuntu-latest

    # Grant write permissions to the repository contents
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Optimize images
        run: node scripts/optimize-images.js public/**/*.{jpg,jpeg,png}

      - name: Commit optimized images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public
          git diff --cached --quiet || git commit -m "chore: optimize images [skip ci]"
          git push
